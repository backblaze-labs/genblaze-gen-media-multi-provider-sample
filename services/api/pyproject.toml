[project]
name = "genblaze-gen-media-multi-provider-sample-api"
version = "0.1.0"
description = "Multi-provider generative-media pipeline (Genblaze + Backblaze B2)."
requires-python = ">=3.11"
dependencies = [
  "genblaze-core>=0.3.2,<0.4",
  "genblaze-s3>=0.3.2,<0.4",
  "genblaze-openai>=0.3.0,<0.4",
  "genblaze-google>=0.3.0,<0.4",
  "genblaze-decart>=0.3.0,<0.4",
  "genblaze-nvidia>=0.3.0,<0.4",
  "genblaze-gmicloud>=0.3.1,<0.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.14.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "T20", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
